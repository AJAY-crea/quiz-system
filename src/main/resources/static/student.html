<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Class Quiz</title>
  <style>
    :root {
      --bg: #f7f7f5; --card: #ffffff; --text: #1d1d1b; --muted: #6b6b66;
      --accent: #2f5bd3; --ok: #1f7a4d; --warn: #a15c00; --border: #deded9;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #161615; --card: #20201e; --text: #ececea; --muted: #a3a39d;
        --accent: #7c9cf0; --ok: #5cc493; --warn: #f0b35a; --border: #34342f;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 16px; background: var(--bg); color: var(--text);
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    main { max-width: 560px; margin: 0 auto; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
    h1 { font-size: 20px; margin: 0 0 16px; }
    label.field { display: block; margin-bottom: 12px; color: var(--muted); font-size: 14px; }
    input[type=text], input[inputmode], textarea {
      width: 100%; margin-top: 4px; padding: 10px 12px; font: inherit; color: var(--text);
      background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
    }
    textarea { min-height: 120px; resize: vertical; }
    button {
      width: 100%; padding: 12px; font: inherit; font-weight: 600; color: #fff;
      background: var(--accent); border: 0; border-radius: 8px; cursor: pointer;
    }
    .error { color: var(--warn); min-height: 1.5em; }
    .hint { color: var(--muted); font-size: 14px; margin: 0 0 12px; }
    .bar { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 16px; }
    .who { color: var(--muted); font-size: 14px; }
    .pill { font-size: 13px; padding: 2px 10px; border-radius: 999px; border: 1px solid currentColor; }
    .pill.ok { color: var(--ok); }
    .pill.warn { color: var(--warn); }
    .meta { display: flex; justify-content: space-between; color: var(--muted); font-size: 14px; }
    .question-text { font-size: 18px; margin: 8px 0 16px; white-space: pre-wrap; }
    .option {
      display: block; padding: 12px; margin-bottom: 8px; border: 1px solid var(--border);
      border-radius: 8px; cursor: pointer;
    }
    .status { margin-top: 12px; font-weight: 600; }
  </style>
</head>
<body>
<main>
  <section id="join" class="card">
    <h1>Join the class quiz</h1>
    <form id="join-form">
      <div id="manual-fields">
        <p class="hint">Scan the QR code on the screen, or type the two values shown under it.</p>
        <label class="field">Session number
          <input id="session-id" inputmode="numeric" autocomplete="off">
        </label>
        <label class="field">Join code
          <input id="join-code" type="text" autocomplete="off" autocapitalize="characters">
        </label>
      </div>
      <label class="field">Roll number
        <input id="roll-no" type="text" required autocomplete="off" autocapitalize="characters">
      </label>
      <p class="hint">Your roll number is linked to this phone.</p>
      <p id="join-error" class="error"></p>
      <button type="submit" id="join-button">Join</button>
    </form>
  </section>

  <section id="quiz" hidden>
    <div class="bar">
      <span id="who" class="who"></span>
      <span id="connection" class="pill warn">Connecting…</span>
    </div>
    <div class="card">
      <p id="message"></p>
      <div id="question" hidden>
        <div class="meta"><span id="question-number"></span><span id="countdown"></span></div>
        <p id="question-text" class="question-text"></p>
        <form id="answer-form">
          <div id="options"></div>
          <textarea id="typed" hidden placeholder="Type your answer"></textarea>
          <button type="submit">Submit answer</button>
        </form>
        <p id="answer-status" class="status"></p>
      </div>
    </div>
  </section>
</main>
<script type="module" src="/js/student.js"></script>
</body>
</html>
