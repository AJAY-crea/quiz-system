spring:
  application:
    name: quiz-system
  datasource:
    url: jdbc:h2:file:./data/quizdb;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console
  # Browsers (and Cloudflare, when a tunnel is used) must check for a newer page or script on every
  # load, so a fix to the HTML/JS reaches phones as soon as they reload instead of an old cached copy.
  web:
    resources:
      cache:
        cachecontrol:
          no-cache: true

server:
  port: 8080
